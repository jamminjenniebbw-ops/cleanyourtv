name: Build CleanYourTV with Prayer Times

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "launcher/app/src/main/**"
      - "launcher/app/build.gradle"
      - "launcher/gradle/**"
      - "launcher/gradlew"
      - ".github/workflows/build-cleanyourtv-prayer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build CleanYourTV launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload modified CleanYourTV APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Prayer-Times-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
