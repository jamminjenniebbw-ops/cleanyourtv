name: Build CleanYourTV with Prayer Times

# Manual-only fallback build. The canonical TV APK is built by the phone workflow
# so both deliverables use the same APK and the same persistent signing identity.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent launcher signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cleanyourtv-launcher-debug-signing-v1
      - name: Build CleanYourTV launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload modified CleanYourTV APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Prayer-Times-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
