name: Build Prayer Home Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "addons/prayer-home/**"
      - ".github/workflows/build-prayer-home.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Extract standalone launcher project
        run: |
          mkdir -p /tmp/prayer-home
          unzip -q addons/prayer-home/source.zip -d /tmp/prayer-home
      - name: Build debug APK
        working-directory: /tmp/prayer-home/CleanYourTVPrayerHome
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerHome-AndroidTV-APK
          path: /tmp/prayer-home/CleanYourTVPrayerHome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
