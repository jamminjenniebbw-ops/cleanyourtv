name: Build Prayer Times APK

on:
  workflow_dispatch:
  push:
    paths:
      - "addons/prayer-times/**"
      - ".github/workflows/build-prayer-times.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Build Prayer Times
        working-directory: addons/prayer-times
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-apk
          path: addons/prayer-times/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
